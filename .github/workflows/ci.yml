name: THRESH CI — Typecheck, Unit Tests & Bundle Budget

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript check
        run: npm run lint

      - name: Run Vitest unit & security test suite
        run: npm test

      - name: Build production PWA bundle
        run: npm run build

      - name: Enforce <220 KB gzip entry bundle & clean dist gate
        run: npm run check:bundle
