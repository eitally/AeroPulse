name: MeetReady CI — Typecheck, Unit Tests & Bundle Budget

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript check
        run: npm run lint

      - name: Run Vitest unit & security test suite
        run: npm test

      - name: Build production PWA bundle
        run: npm run build

      - name: Enforce <220 KB gzip entry bundle & clean dist gate
        run: npm run check:bundle

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E visual regression suite (QA-01)
        run: npm run test:e2e
        env:
          NODE_ENV: test
          SERVE_BUILT_DIST: '1'
          CI: 'true'

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meetready
          POSTGRES_PASSWORD: meetready_ci_password
          POSTGRES_DB: meetready_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meetready -d meetready_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Postgres vault, row-lock & delete integration tests
        run: npx vitest run tests/sprint0SecurityAndReliability.test.ts tests/vaultAndCleanRoom.test.ts
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://meetready:meetready_ci_password@127.0.0.1:5432/meetready_test
          SESSION_SECRET: ci_postgres_test_session_secret_0123456789abcdef
          TOKEN_VAULT_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
