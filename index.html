    <script>
      (function () {
        // Self-migrate any stale PWA / cached Service Worker tab off legacy aeropulse-eta.vercel.app
        if (typeof window !== 'undefined' && window.location.hostname === 'aeropulse-eta.vercel.app') {
          var targetUrl =
            'https://meetready.app' +
            window.location.pathname +
            window.location.search +
            window.location.hash;
          var cleanupTasks = [];
          if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && navigator.serviceWorker) {
            cleanupTasks.push(
              navigator.serviceWorker
                .getRegistrations()
                .then(function (regs) {
                  return Promise.all(
                    regs.map(function (reg) {
                      return reg.unregister().catch(function () {});
                    })
                  );
                })
                .catch(function () {})
            );
          }
          if ('caches' in window && window.caches) {
            cleanupTasks.push(
              window.caches
                .keys()
                .then(function (keys) {
                  return Promise.all(
                    keys.map(function (key) {
                      return window.caches.delete(key).catch(function () {});
                    })
                  );
                })
                .catch(function () {})
            );
          }
          var timeoutFallback = new Promise(function (resolve) {
            window.setTimeout(resolve, 350);
          });
          Promise.race([Promise.all(cleanupTasks), timeoutFallback]).finally(function () {
            window.location.replace(targetUrl);
          });
          return;
        }
        // Skip service worker caching and reload triggers in test / demo mode
        if (
          typeof window !== 'undefined' &&
          (window.location.search.includes('demo=1') ||
            window.location.search.includes('sample=coach') ||
            window.location.search.includes('sample=athlete') ||
            window.location.search.includes('sample=true') ||
            window.location.hash.includes('demo=1'))
        ) {
          return;
        }
        // Purge legacy Service Worker caches so no stale or unauthenticated API responses persist
        if (typeof window !== 'undefined' && 'caches' in window) {
          ['aeropulse-ui-assets-swr', 'aeropulse-telemetry-api-swr'].forEach(function (name) {
            window.caches.delete(name).catch(function () {});
          });
        }
        if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
          navigator.serviceWorker
            .getRegistrations()
            .then(function (regs) {
              regs.forEach(function (reg) {
                reg.update().catch(function () {});
              });
            })
            .catch(function () {});
        }
      })();
    </script>
