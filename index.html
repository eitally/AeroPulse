    <script>
      (function () {
        // Self-migrate any stale PWA / cached Service Worker tab off legacy aeropulse-eta.vercel.app
        if (typeof window !== 'undefined' && window.location.hostname === 'aeropulse-eta.vercel.app') {
          if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
            navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                return Promise.all(
                  regs.map(function (reg) {
                    return reg.unregister();
                  })
                );
              })
              .catch(function () {});
          }
          window.location.replace(
            'https://thresh-dev.vercel.app' +
              window.location.pathname +
              window.location.search +
              window.location.hash
          );
          return;
        }
        // Skip service worker caching and reload triggers in test / demo mode
        if (typeof window !== 'undefined' && (window.location.search.includes('demo=1') || window.location.hash.includes('demo=1'))) {
          return;
        }
        // Purge legacy Service Worker caches so no stale or unauthenticated API responses persist
        if (typeof window !== 'undefined' && 'caches' in window) {
          ['aeropulse-ui-assets-swr', 'aeropulse-telemetry-api-swr'].forEach(function (name) {
            window.caches.delete(name).catch(function () {});
          });
        }
        if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.update().catch(function () {});
            });
          });
        }
      })();
    </script>
