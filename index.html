    <script>
      (function () {
        // Purge legacy Service Worker caches so no stale or unauthenticated API responses persist
        if (typeof window !== 'undefined' && 'caches' in window) {
          ['aeropulse-ui-assets-swr', 'aeropulse-telemetry-api-swr'].forEach(function (name) {
            window.caches.delete(name).catch(function () {});
          });
        }
        if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
          var refreshingSw = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (refreshingSw) return;
            refreshingSw = true;
            window.location.reload();
          });
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.update().catch(function () {});
            });
          });
        }
      })();
    </script>
